# Builds and publishes a sideloadable beta Android APK with Capacitor
# (no local SDK or signing secrets needed).
# The app shell loads the deployed public backend over HTTPS; nothing is
# bundled except a static fallback page. No secrets are used or logged:
# the build needs no .env, database, or credentials of any kind.
#
# Push an android-v* tag or run manually from the main branch. The APK is
# attached to the GitHub Release for that tag.
name: Android APK (beta)

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unique release tag for this APK (for example android-v0.1.0)
        required: true
        default: android-v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build beta APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/emergency-care-android.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emergency-care-android-beta
          path: android/app/build/outputs/apk/debug/emergency-care-android.apk
          if-no-files-found: error

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Emergency Care Android beta (${{ inputs.release_tag || github.ref_name }})
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/debug/emergency-care-android.apk
